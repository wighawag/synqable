      <rect width="256" height="256" fill="#e5399f"/>
      <path d="M128 0 V68 H88 V128 H168 V188 H128 V256 H0 V0 Z" fill="#eef1f6"/>
    </g>
    <text id="wordmark" x="464.1665" y="323" style="font-family:'Manrope';font-weight:800;font-size:145.8372px;fill:#eef1f6">synqable</text>
    <rect x="470" y="375" width="120" height="6" rx="3" fill="#e5399f"/>
    <text id="tagline" x="467.9226" y="417" style="font-family:'Manrope';font-weight:500;font-size:25.968px;fill:#8e97a8">Local-first stores that converge on your terms.</text>
